<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0c0e1a"/>
  <g fill="none" stroke="#61dafb" stroke-width="2" opacity="0.95">
    <g transform="rotate(0 32 32)">
      <ellipse cx="32" cy="32" rx="20" ry="8.5"/>
      <circle cx="12" cy="32" r="2.6" fill="#61dafb"/>
      <circle cx="52" cy="32" r="2.6" fill="#61dafb"/>
    </g>
    <g transform="rotate(60 32 32)">
      <ellipse cx="32" cy="32" rx="20" ry="8.5"/>
      <circle cx="12" cy="32" r="2.6" fill="#61dafb"/>
      <circle cx="52" cy="32" r="2.6" fill="#61dafb"/>
    </g>
    <g transform="rotate(120 32 32)">
      <ellipse cx="32" cy="32" rx="20" ry="8.5"/>
      <circle cx="12" cy="32" r="2.6" fill="#61dafb"/>
      <circle cx="52" cy="32" r="2.6" fill="#61dafb"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#61dafb" filter="url(#glow)"/>
</svg>